<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #12100d;
  --bg-raised: #1a1713;
  --bg-inset: #0c0b09;
  --line: #2e2820;
  --line-bright: #453c2e;
  --text: #d8cfbe;
  --text-dim: #8a7f6a;
  --amber: #ffb347;
  --amber-dim: #a86f1f;
  --green: #7dd181;
  --red: #e46a5a;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --display: "Archivo", "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  font-family: var(--mono);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
  background:
    repeating-linear-gradient(0deg, rgba(255,179,71,0.012) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse 120% 80% at 50% -20%, #1e1a13 0%, var(--bg) 60%);
}
::selection { background: var(--amber); color: var(--bg); }

/* -------- header -------- */
header {
  display: flex; align-items: baseline; gap: 16px;
  padding: 22px 28px 0;
  border-bottom: 1px solid var(--line);
}
header h1 {
  font-family: var(--display);
  font-weight: 900;
  font-size: 22px;
  letter-spacing: -0.5px;
  text-transform: uppercase;
  color: var(--amber);
}
header h1::before { content: "▞▞ "; color: var(--amber-dim); }
#clock { margin-left: auto; color: var(--text-dim); font-size: 12px; }
nav { display: flex; gap: 2px; margin-top: 14px; }
nav button {
  font-family: var(--mono); font-size: 12px; letter-spacing: 1px;
  text-transform: uppercase;
  background: transparent; color: var(--text-dim);
  border: 1px solid var(--line); border-bottom: none;
  padding: 8px 22px; cursor: pointer;
}
nav button.active {
  background: var(--bg-raised); color: var(--amber);
  border-color: var(--line-bright);
  box-shadow: inset 0 2px 0 var(--amber);
}
nav button:hover:not(.active) { color: var(--text); }

main { padding: 24px 28px 60px; max-width: 1180px; }
.pane { display: none; }
.pane.active { display: block; animation: rise .25s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

/* -------- shared bits -------- */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
.dot.on  { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot.off { background: transparent; border: 1px solid var(--text-dim); }
.dot.err { background: var(--red); box-shadow: 0 0 6px var(--red); border-radius: 1px; }
button.act {
  font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  background: var(--bg-inset); color: var(--text);
  border: 1px solid var(--line-bright); padding: 4px 12px; cursor: pointer;
}
button.act:hover { border-color: var(--amber); color: var(--amber); }
button.act.primary { color: var(--amber); border-color: var(--amber-dim); }
button.act.primary:hover { background: var(--amber); color: var(--bg); }
.muted { color: var(--text-dim); }
.empty { color: var(--text-dim); padding: 30px 0; }
.grouphead {
  margin: 22px 0 8px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--amber-dim);
}
.grouphead::after { content: " ────────────────────"; color: var(--line-bright); }

/* -------- tables -------- */
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-dim); font-weight: 400;
  border-bottom: 1px solid var(--line-bright); padding: 6px 10px;
}
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.rowhover:hover td { background: rgba(255,179,71,0.03); }
td .sub { color: var(--text-dim); font-size: 11px; }
td.actions { white-space: nowrap; text-align: right; }
td.actions button { margin-left: 6px; }

/* -------- prompt chips + inline editor -------- */
.chip {
  display: inline-block; margin: 1px 6px 1px 0; padding: 1px 9px;
  font-family: var(--mono); font-size: 11px;
  background: var(--bg-inset); color: var(--text);
  border: 1px solid var(--line-bright); border-radius: 2px; cursor: pointer;
}
.chip::before { content: "¶ "; color: var(--amber-dim); }
.chip:hover, .chip.open { border-color: var(--amber); color: var(--amber); }
.chip.engine::before { content: "⚙ "; color: var(--amber-dim); }
.engineform { display: flex; align-items: center; gap: 10px; padding: 10px 14px; flex-wrap: wrap; }
.engineform select, .engineform input {
  font-family: var(--mono); font-size: 12px; color: var(--text);
  background: var(--bg-raised); border: 1px solid var(--line-bright);
  padding: 4px 8px; outline: none;
}
.engineform select:focus, .engineform input:focus { border-color: var(--amber); }
.engineform input { width: 260px; }
.engineform label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); }
tr.editor td { background: var(--bg-inset); padding: 0; }
.editorbox { display: flex; flex-direction: column; border-left: 2px solid var(--amber-dim); }
.editorbox .ebar {
  display: flex; align-items: center; gap: 12px;
  padding: 7px 14px; border-bottom: 1px solid var(--line);
}
.editorbox .ebar .path { color: var(--amber); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.editorbox .ebar .spacer { flex: 1; }
.editorbox textarea {
  font-family: var(--mono); font-size: 12px; line-height: 1.55;
  color: var(--text); background: transparent; border: none; outline: none;
  padding: 12px 14px; min-height: 240px; resize: vertical;
}

/* -------- log drawer -------- */
#drawer {
  position: fixed; inset: auto 0 0 0; max-height: 55vh;
  background: var(--bg-inset); border-top: 2px solid var(--amber-dim);
  display: none; flex-direction: column; z-index: 10;
}
#drawer.open { display: flex; }
#drawer .bar {
  display: flex; align-items: center; gap: 14px;
  padding: 8px 20px; border-bottom: 1px solid var(--line);
  background: var(--bg-raised);
}
#drawer .bar .title { color: var(--amber); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#drawer .bar .spacer { flex: 1; }
#drawer pre {
  flex: 1; overflow: auto; padding: 14px 20px;
  font-size: 12px; line-height: 1.55;
  white-space: pre-wrap; word-break: break-word;
}

#toast {
  position: fixed; top: 18px; right: 22px; z-index: 20;
  background: var(--bg-raised); border: 1px solid var(--amber-dim);
  color: var(--amber); padding: 8px 16px; font-size: 12px;
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Corral</h1>
  <span id="summary" class="muted"></span>
  <span id="clock"></span>
</header>
<nav>
  <div style="width:28px"></div>
  <button data-pane="agents" class="active">Agents</button>
  <button data-pane="sessions">Sessions</button>
</nav>
<main>
  <section id="agents" class="pane active"><div class="empty">Loading agents...</div></section>
  <section id="sessions" class="pane"><div class="empty">Loading sessions...</div></section>
</main>

<div id="drawer">
  <div class="bar">
    <span class="title" id="drawer-title"></span>
    <span class="spacer"></span>
    <button class="act" id="drawer-close">Close</button>
  </div>
  <pre id="drawer-pre"></pre>
</div>
<div id="toast"></div>

<script>
"use strict";
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg, ms = 2200) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), ms);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

/* -------- tabs -------- */
document.querySelectorAll("nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".pane").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    $("#" + btn.dataset.pane).classList.add("active");
  });
});

/* -------- clock -------- */
setInterval(() => {
  $("#clock").textContent = new Date().toLocaleTimeString([], {hour12: false});
}, 1000);

/* -------- log drawer -------- */
function openDrawer(title, text) {
  $("#drawer-title").textContent = title;
  $("#drawer-pre").textContent = text;
  $("#drawer").classList.add("open");
  const p = $("#drawer-pre"); p.scrollTop = p.scrollHeight;
}
$("#drawer-close").addEventListener("click", () => $("#drawer").classList.remove("open"));

/* -------- agents + prompts (one view) -------- */
let openEditorPath = null;  // survives refresh: reopen the same editor
let ENGINES = ["claude"];
api("/api/engines").then(e => ENGINES = e).catch(() => {});

async function loadAgents() {
  let agents, promptFiles;
  try {
    [agents, promptFiles] = await Promise.all([api("/api/agents"), api("/api/prompts")]);
  } catch (e) {
    $("#agents").innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`;
    return;
  }
  if (openEditorPath && $("#agents").querySelector("tr.editor textarea")?.dataset.dirty === "1") {
    return;  // never clobber unsaved edits on auto-refresh
  }
  if ($("#agents").querySelector("tr.editor-engine")) {
    return;  // engine editor open; do not clobber it
  }

  const running = agents.filter(a => a.running).length;
  $("#summary").textContent = `${running} running / ${agents.length} agents`;
  if (!agents.length && !promptFiles.length) {
    $("#agents").innerHTML = `<div class="empty">No LaunchAgents matched. Adjust launchagent_patterns in ~/.config/corral/config.json</div>`;
    return;
  }

  // Bucket prompts: linked to an agent label, else to a group, else loose
  const byLabel = {}, byGroup = {}, loose = [];
  const labels = new Set(agents.map(a => a.label));
  const groupNames = new Set(agents.map(a => a.group).filter(Boolean));
  for (const f of promptFiles) {
    if (f.agent_label && labels.has(f.agent_label)) {
      (byLabel[f.agent_label] = byLabel[f.agent_label] || []).push(f);
    } else if (f.group && groupNames.has(f.group)) {
      (byGroup[f.group] = byGroup[f.group] || []).push(f);
    } else {
      loose.push(f);
    }
  }

  const groups = {};
  agents.forEach(a => (groups[a.group || ""] = groups[a.group || ""] || []).push(a));
  const keys = Object.keys(groups).sort((a, b) => (a === "") ? -1 : (b === "") ? 1 : a.localeCompare(b));

  let html = "";
  for (const key of keys) {
    if (key) html += `<div class="grouphead">${esc(key)}</div>`;
    html += `<table><tr><th style="width:26%">Agent</th><th style="width:12%">Status</th><th style="width:13%">Schedule</th><th>Prompt</th><th style="text-align:right;width:22%">Actions</th></tr>`;
    for (const a of groups[key]) {
      html += agentRow(a, byLabel[a.label] || []);
    }
    // Group-level prompt files not tied to one schedule entry
    const extras = key ? (byGroup[key] || []) : [];
    if (extras.length) {
      html += `<tr class="rowhover"><td class="muted">shared prompts</td><td></td><td></td><td colspan="2">${extras.map(chip).join("")}</td></tr>`;
    }
    html += `</table>`;
  }
  if (loose.length) {
    html += `<div class="grouphead">other prompts</div><table>`;
    html += `<tr class="rowhover"><td>${loose.map(chip).join("")}</td></tr></table>`;
  }
  $("#agents").innerHTML = html;
  wireAgents();
  if (openEditorPath) {
    const c = $("#agents").querySelector(`.chip[data-edit="${CSS.escape(openEditorPath)}"]`);
    if (c) c.click(); else openEditorPath = null;
  }
}

function agentRow(a, prompts) {
  const dot = a.running ? "on" : a.error ? "err" : "off";
  const status = a.running ? `PID ${esc(a.pid)}`
    : a.error ? `exit ${esc(a.exit_code)}`
    : a.loaded ? "loaded" : "not loaded";
  let engineChip = "";
  if (a.registry_name && !a.is_service) {
    const text = esc(a.engine) + (a.model ? " · " + esc(a.model) : "");
    engineChip = `<span class="chip engine" data-engine-edit="${esc(a.registry_name)}"
      data-engine="${esc(a.engine)}" data-model="${esc(a.model)}"
      title="Engine and model for this agent. Wrapper commands receive it as CORRAL_ENGINE / CORRAL_MODEL.">${text}</span>`;
  }
  return `<tr class="rowhover">
    <td><span class="dot ${dot}"></span>${esc(a.name)}<div class="sub">${esc(a.label)}</div></td>
    <td>${status}${a.keep_alive ? '<div class="sub">keepalive</div>' : ""}</td>
    <td>${esc(a.schedule)}</td>
    <td>${prompts.length ? prompts.map(chip).join("") : '<span class="muted">none</span>'}${engineChip}</td>
    <td class="actions">
      ${a.stdout_log ? `<button class="act" data-log="${esc(a.label)}" data-which="stdout">log</button>` : ""}
      ${a.stderr_log ? `<button class="act" data-log="${esc(a.label)}" data-which="stderr">err</button>` : ""}
      ${a.running
        ? `<button class="act" data-do="restart" data-label="${esc(a.label)}">restart</button>
           <button class="act" data-do="stop" data-label="${esc(a.label)}">stop</button>`
        : `<button class="act primary" data-do="start" data-label="${esc(a.label)}">start</button>`}
    </td></tr>`;
}

function chip(f) {
  return `<span class="chip" data-edit="${esc(f.path)}" title="${esc(f.path)}">${esc(f.name)}</span>`;
}

function wireAgents() {
  const root = $("#agents");
  root.querySelectorAll("[data-do]").forEach(btn => btn.addEventListener("click", async () => {
    btn.disabled = true;
    try {
      await api(`/api/agents/${encodeURIComponent(btn.dataset.label)}/${btn.dataset.do}`, {method: "POST"});
      toast(`${btn.dataset.do}: ${btn.dataset.label}`);
    } catch (e) { toast("Error: " + e.message); }
    setTimeout(loadAgents, 600);
  }));
  root.querySelectorAll("[data-log]").forEach(btn => btn.addEventListener("click", async () => {
    try {
      const d = await api(`/api/agents/${encodeURIComponent(btn.dataset.log)}/log?which=${btn.dataset.which}&lines=300`);
      openDrawer(d.path, d.content || "(empty)");
    } catch (e) { toast("Error: " + e.message); }
  }));
  root.querySelectorAll(".chip:not(.engine)").forEach(c => c.addEventListener("click", () => toggleEditor(c)));
  root.querySelectorAll(".chip.engine").forEach(c => c.addEventListener("click", () => toggleEngineEditor(c)));
}

function toggleEngineEditor(chipEl) {
  const existing = $("#agents").querySelector("tr.editor");
  const wasOpen = chipEl.classList.contains("open");
  if (existing) {
    existing.remove();
    $("#agents").querySelectorAll(".chip.open").forEach(c => c.classList.remove("open"));
    openEditorPath = null;
    if (wasOpen) return;
  }
  chipEl.classList.add("open");
  const name = chipEl.dataset.engineEdit;
  const hostRow = chipEl.closest("tr");
  const tr = document.createElement("tr");
  tr.className = "editor editor-engine";
  const options = ENGINES.map(e =>
    `<option value="${esc(e)}" ${e === chipEl.dataset.engine ? "selected" : ""}>${esc(e)}</option>`).join("");
  tr.innerHTML = `<td colspan="5"><div class="editorbox"><div class="engineform">
    <label>Engine</label><select data-eng>${options}</select>
    <label>Model</label><input data-mod value="${esc(chipEl.dataset.model)}"
      placeholder="engine default">
    <button class="act primary" data-save>Save</button>
    <button class="act" data-cancel>Close</button>
    <span class="muted" style="font-size:11px">applies on next run; services restart now</span>
  </div></div></td>`;
  hostRow.after(tr);
  tr.querySelector("[data-save]").addEventListener("click", async () => {
    const engine = tr.querySelector("[data-eng]").value;
    const model = tr.querySelector("[data-mod]").value.trim();
    try {
      const d = await api(`/api/registry/${encodeURIComponent(name)}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ engine, model }),
      });
      toast(`${name}: ${engine}${model ? " · " + model : ""}${d.restarted ? " (restarted)" : ""}`);
      tr.remove();
      loadAgents();
    } catch (e) { toast("Error: " + e.message, 4000); }
  });
  tr.querySelector("[data-cancel]").addEventListener("click", () => {
    tr.remove();
    chipEl.classList.remove("open");
  });
}

async function toggleEditor(chipEl) {
  const path = chipEl.dataset.edit;
  const existing = $("#agents").querySelector("tr.editor");
  const wasOpen = chipEl.classList.contains("open");
  if (existing) {
    const ta = existing.querySelector("textarea");
    if (ta?.dataset.dirty === "1" && !confirm("Discard unsaved changes?")) return;
    existing.remove();
    $("#agents").querySelectorAll(".chip.open").forEach(c => c.classList.remove("open"));
    openEditorPath = null;
    if (wasOpen) return;
  }
  let d;
  try { d = await api(`/api/prompts/file?path=${encodeURIComponent(path)}`); }
  catch (e) { toast("Error: " + e.message); return; }

  chipEl.classList.add("open");
  openEditorPath = path;
  const hostRow = chipEl.closest("tr");
  const cols = hostRow.children.length === 1 ? 1 : 5;
  const tr = document.createElement("tr");
  tr.className = "editor";
  tr.innerHTML = `<td colspan="${cols}"><div class="editorbox">
    <div class="ebar">
      <span class="path">${esc(path)}</span>
      <span class="spacer"></span>
      <button class="act primary" data-save>Save</button>
      <button class="act" data-cancel>Close</button>
    </div>
    <textarea spellcheck="false"></textarea>
  </div></td>`;
  hostRow.after(tr);
  const ta = tr.querySelector("textarea");
  ta.value = d.content;
  ta.style.height = Math.min(500, Math.max(240, d.content.split("\n").length * 19 + 40)) + "px";
  ta.addEventListener("input", () => ta.dataset.dirty = "1");
  tr.querySelector("[data-save]").addEventListener("click", async () => {
    try {
      await api("/api/prompts/file", {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ path, content: ta.value }),
      });
      ta.dataset.dirty = "0";
      toast("Saved " + path);
    } catch (e) { toast("Save failed: " + e.message, 4000); }
  });
  tr.querySelector("[data-cancel]").addEventListener("click", () => {
    if (ta.dataset.dirty === "1" && !confirm("Discard unsaved changes?")) return;
    tr.remove();
    chipEl.classList.remove("open");
    openEditorPath = null;
  });
}

/* -------- sessions -------- */
function ageStr(mtime) {
  const d = Date.now() / 1000 - mtime;
  if (d < 3600) return Math.max(1, Math.floor(d / 60)) + "m";
  if (d < 86400) return Math.floor(d / 3600) + "h";
  return Math.floor(d / 86400) + "d";
}
async function loadSessions() {
  let list;
  try { list = await api("/api/sessions?limit=60"); }
  catch (e) { $("#sessions").innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`; return; }
  if (!list.length) {
    $("#sessions").innerHTML = `<div class="empty">No Claude Code sessions found.</div>`;
    return;
  }
  let html = `<table><tr><th style="width:6%">Age</th><th style="width:18%">Project</th><th>Last prompt / summary</th><th style="width:8%">Branch</th><th style="text-align:right;width:16%">Actions</th></tr>`;
  for (const s of list) {
    const proj = s.cwd ? s.cwd.split("/").filter(Boolean).pop() : s.project;
    html += `<tr class="rowhover">
      <td>${ageStr(s.mtime)}</td>
      <td>${esc(proj)}<div class="sub">${esc(s.cwd || "")}</div></td>
      <td>${esc(s.title)}<div class="sub">${esc(s.id)}</div></td>
      <td>${esc(s.branch || "")}</td>
      <td class="actions">
        <button class="act" data-copy="${esc(s.id)}" data-cwd="${esc(s.cwd || "")}">copy cmd</button>
        <button class="act primary" data-resume="${esc(s.id)}">resume</button>
      </td></tr>`;
  }
  html += `</table>`;
  $("#sessions").innerHTML = html;

  $("#sessions").querySelectorAll("[data-resume]").forEach(btn => btn.addEventListener("click", async () => {
    btn.disabled = true; btn.textContent = "opening...";
    try {
      const d = await api(`/api/sessions/${btn.dataset.resume}/resume`, {method: "POST"});
      toast("Opened terminal: " + d.command, 3500);
    } catch (e) { toast("Error: " + e.message, 4000); }
    btn.disabled = false; btn.textContent = "resume";
  }));
  $("#sessions").querySelectorAll("[data-copy]").forEach(btn => btn.addEventListener("click", () => {
    const cwd = btn.dataset.cwd;
    const cmd = (cwd ? `cd '${cwd}' && ` : "") + `claude --resume ${btn.dataset.copy}`;
    navigator.clipboard.writeText(cmd);
    toast("Copied: " + cmd, 3000);
  }));
}

loadAgents(); loadSessions();
setInterval(loadAgents, 15000);
setInterval(loadSessions, 30000);
</script>
</body>
</html>
